[settings]
experimental = true
lockfile = true
disable_backends = [
    "asdf",
    "vfox",
]
# windows-arm64 and macos-x64 are both absent because MaxMind supports neither
# Windows ARM64 nor Intel Mac. macos-x64 would have to stay absent regardless:
# pnpm 11 ships no darwin-x64 binary, so when mise locks that platform it falls
# back to the release's unrelated source-maps.tgz, producing an entry that
# verifies but contains no pnpm.
lockfile_platforms = [
    "linux-arm64",
    "linux-arm64-musl",
    "linux-x64",
    "linux-x64-musl",
    "macos-arm64",
    "windows-x64",
]

[tools]
node = "latest"
lychee = "latest"
# Not aqua:pnpm/pnpm: the aqua registry's pnpm config keeps breaking on
# release-asset naming changes (jdx/mise discussions #9453, #9624).
"github:pnpm/pnpm" = "v11.22.0"

[hooks]
enter = "mise install --quiet --locked"

[[watch_files]]
patterns = ["mise.toml", "mise.lock"]
run = "mise install --quiet --locked"

[tasks.check-links]
description = "Check links with lychee"
run = "lychee --no-progress './**/*.md' './src/**/*.ts' './package.json'"
