name: Lint
on:
  pull_request:
  push:
  schedule:
    - cron: '3 20 * * SUN'
permissions: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false
      # Install pnpm only, so mise's own node does not shadow the node above.
      - name: Install pnpm
        env:
          MISE_AUTO_INSTALL: 'false'
        run: |
          mise install github:pnpm/pnpm
          dirname "$(mise which pnpm)" >> "$GITHUB_PATH"
      # No lockfile syntax check: pnpm-lock.yaml is YAML, not JSON, and
      # --frozen-lockfile already fails on a missing, malformed, or stale
      # lockfile, which covers strictly more than the old `jq empty` step.
      - name: Install pnpm packages
        run: pnpm install --frozen-lockfile
      - name: Run eslint
        run: pnpm run lint
      - name: Run prettier
        run: pnpm run prettier:ci
      - name: Test compile
        run: pnpm exec tsc --noEmit
